[project]
name = "ebobo-backend"
version = "0.1.0"
description = "eBobo - Zasiłkowy Przewodnik Przyszłego Rodzica (HackNation 2026, ZUS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
"app/api/**" = ["B008"]
"app/admin/**" = ["B008"]
"app/auth/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
