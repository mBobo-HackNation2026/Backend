<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eBobo – Panel administracyjny</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="topbar__title">eBobo – Panel administracyjny</span>
      <button id="logout-btn" class="btn btn--ghost hidden">Wyloguj</button>
    </header>

    <main class="container">
      <section id="login-view" class="card">
        <h1>Logowanie</h1>
        <form id="login-form">
          <label>
            Login
            <input type="text" id="username" name="username" autocomplete="username" required />
          </label>
          <label>
            Hasło
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="btn">Zaloguj</button>
        </form>
        <p id="login-error" class="error hidden"></p>
      </section>

      <section id="dashboard-view" class="hidden">
        <h1>Dashboard</h1>
        <p id="welcome-text"></p>

        <div id="modules" class="modules"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
